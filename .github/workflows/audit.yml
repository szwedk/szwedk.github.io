name: Audit

# The site has no build step and no tests, so a dead link, a thrown
# exception, or a drifted cache stamp would otherwise ship silently and
# only be noticed by a visitor. This runs the same checks by hand-review
# standards on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every script
        run: |
          for f in js/*.js js/features/*.js tools/*.mjs; do
            node --check "$f"
          done

      - name: No em dashes in shipped text
        run: |
          if grep -rlP '\x{2014}' --include='*.html' --include='*.css' --include='*.js' \
               . | grep -v '^./vendor/'; then
            echo "em dash found in the files listed above"
            exit 1
          fi

      - name: Install Playwright chromium
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Run the site audit
        run: node tools/audit.mjs
