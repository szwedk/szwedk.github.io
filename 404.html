<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Kamil Szwed</title>
  <meta name="description" content="This page dissolved. The rest of the site is intact." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/InterTight-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/InstrumentSerif-400-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/style.css?v=22" />
  <style>
    /* Scoped to this page. GitHub Pages serves this file at any missing URL,
       which is why every link and asset above is root-absolute. */
    .nf {
      min-height: 100vh;
      min-height: 100svh;
      background: #050505;
      color: var(--bone);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px var(--pad-x) 90px;
      position: relative;
      overflow: hidden;
    }
    .nf-canvas {
      display: block;
      width: min(86vw, 720px);
      height: clamp(150px, 30vh, 320px);
    }
    .nf h1 {
      margin-top: 10px;
      font-size: clamp(2rem, 4.6vw, 3.6rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .nf h1 em {
      font-family: var(--font-serif);
      font-style: italic;
      letter-spacing: 0;
      font-size: 1.06em;
    }
    .nf-sub {
      margin-top: 20px;
      max-width: 44ch;
      font-size: clamp(0.85rem, 1.05vw, 0.97rem);
      line-height: 1.7;
      color: var(--bone-dim);
    }
    .nf-links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 30px;
      margin-top: 44px;
      padding: 0;
    }
    .nf-links a {
      display: inline-block;
      padding: 6px 2px;
      color: var(--bone-dim);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
      transition: color 0.25s ease;
    }
    .nf-links a:hover { color: var(--bone); }
    .nf-fine {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--bone-faint);
    }
    @media (max-width: 430px) {
      .nf { padding-bottom: 130px; }   /* clear the bottom nav pill */
      .nf-fine { bottom: 84px; }
    }
  </style>
</head>
<body>

  <a class="brand" href="/">
    <span class="brand-name">Kamil Szwed</span>
    <span class="brand-sub">BUILD &middot; DEPLOY &middot; SUPPORT</span>
  </a>

  <header class="site-chrome">
    <nav class="pill-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/#work">Work</a>
      <a href="/#contact">Contact</a>
    </nav>
  </header>

  <main class="nf">
    <canvas class="nf-canvas" id="nfCanvas" role="img" aria-label="The number 404, drawn in particles that keep dissolving at one edge"></canvas>
    <h1>This page <em>dissolved.</em></h1>
    <p class="nf-sub">Whatever lived at this address has scattered into a few
      thousand particles. Everything that matters is still standing.</p>
    <ul class="nf-links">
      <li><a href="/">Back home</a></li>
      <li><a href="/#work">The work</a></li>
      <li><a href="/brief.html">Start a project</a></li>
    </ul>
    <p class="nf-fine">ERR 404 &middot; NOTHING AT THIS ADDRESS</p>
  </main>

  <script>
  (function () {
    'use strict';

    /* Same dissolve grammar as the home hero, pointed at the numerals:
       a noisy front sweeps across "404", shedding particles off one edge
       and rebuilding them, forever. Honors the site's motion choice. */
    var canvas = document.getElementById('nfCanvas');
    var ctx = canvas.getContext('2d');

    var stored = null;
    try { stored = window.localStorage.getItem('ks-motion'); } catch (e) { stored = null; }
    var still = stored
      ? stored === 'off'
      : window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var P = [];            /* particles */
    var W = 0, H = 0, dpr = 1;
    var raf = null;
    var t0 = null;
    var px = -1e4, py = -1e4;   /* pointer, canvas space */

    function rng(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function build() {
      var rect = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(1, Math.round(rect.width * dpr));
      H = Math.max(1, Math.round(rect.height * dpr));
      canvas.width = W;
      canvas.height = H;

      /* rasterize "404", then sample it into targets */
      var off = document.createElement('canvas');
      off.width = W; off.height = H;
      var octx = off.getContext('2d');
      var size = H * 0.86;
      octx.font = '700 ' + size + 'px "Inter Tight", system-ui, sans-serif';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#fff';
      octx.fillText('404', W / 2, H * 0.54);
      var data = octx.getImageData(0, 0, W, H).data;

      var rand = rng(4040);
      var step = Math.max(3, Math.round(4 * dpr));
      P.length = 0;
      for (var y = 0; y < H; y += step) {
        for (var x = 0; x < W; x += step) {
          if (data[(y * W + x) * 4 + 3] < 128) continue;
          var nx = x / W;
          P.push({
            tx: x, ty: y,                 /* home, on the glyph          */
            x: x, y: y,
            vx: 0, vy: 0,
            /* dissolve threshold: front sweeps right to left, noisy edge */
            a0: 0.16 + ((1 - nx) * 0.62 + rand() * 0.38) * 0.62,
            drift: 0.4 + rand() * 1.1,    /* how fast it flees           */
            ang: rand() * Math.PI * 2,    /* flee direction              */
            dim: 0.55 + rand() * 0.45
          });
        }
      }
    }

    function draw(diss) {
      ctx.clearRect(0, 0, W, H);
      var s = Math.max(1.6, 1.2 * dpr);
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        var gone = Math.max(0, Math.min(1, (diss - p.a0) / 0.16));

        if (gone > 0) {
          /* shed: ride outward along its own heading, sagging upward
             like the hero melt, fading as it goes */
          var d = gone * gone * 90 * dpr * p.drift;
          p.x = p.tx + Math.cos(p.ang) * d;
          p.y = p.ty + Math.sin(p.ang) * d * 0.6 - gone * 26 * dpr;
        } else {
          /* seated, with a whisper of thermal jitter */
          p.x += (p.tx - p.x) * 0.14 + p.vx;
          p.y += (p.ty - p.y) * 0.14 + p.vy;
          p.vx *= 0.86; p.vy *= 0.86;
          /* pointer disturbance */
          var dx = p.x - px, dy = p.y - py;
          var dd = dx * dx + dy * dy;
          var R = 80 * dpr;
          if (dd < R * R) {
            var m = 1 - Math.sqrt(dd) / R;
            p.vx += (dx / (Math.sqrt(dd) + 0.01)) * m * 2.4 * dpr;
            p.vy += (dy / (Math.sqrt(dd) + 0.01)) * m * 2.4 * dpr;
          }
        }

        var a = p.dim * (1 - gone * 0.92);
        if (a <= 0.02) continue;
        ctx.globalAlpha = a;
        ctx.fillStyle = '#f2efe9';
        ctx.fillRect(p.x, p.y, s, s);
      }
      ctx.globalAlpha = 1;
    }

    function loop(now) {
      if (t0 === null) t0 = now;
      /* the front breathes: mostly intact, one long exhale, back again */
      var breath = (now - t0) / 8200;
      var diss = 0.30 + 0.34 * Math.sin(breath * Math.PI * 2 - Math.PI / 2);
      draw(diss);
      raf = window.requestAnimationFrame(loop);
    }

    function start() {
      build();
      if (still || P.length === 0) {
        draw(0.18);          /* one bite out of the corner, then hold still */
        return;
      }
      raf = window.requestAnimationFrame(loop);
    }

    canvas.addEventListener('pointermove', function (e) {
      var r = canvas.getBoundingClientRect();
      px = (e.clientX - r.left) * dpr;
      py = (e.clientY - r.top) * dpr;
    });
    canvas.addEventListener('pointerleave', function () { px = -1e4; py = -1e4; });

    var rsz = null;
    window.addEventListener('resize', function () {
      if (rsz) window.clearTimeout(rsz);
      rsz = window.setTimeout(function () {
        if (raf) { window.cancelAnimationFrame(raf); raf = null; t0 = null; }
        start();
      }, 160);
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (raf) { window.cancelAnimationFrame(raf); raf = null; }
      } else if (!still && !raf) {
        t0 = null;
        raf = window.requestAnimationFrame(loop);
      }
    });

    /* wait for the face so the glyph rasterizes in the right type */
    if (document.fonts && document.fonts.load) {
      document.fonts.load('700 100px "Inter Tight"').then(start, start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
